---
- name: users | Fail if distro is not supported
  ansible.builtin.fail:
    msg: "Distribution '{{ ansible_distribution }}' is not supported. Supported: Debian, Ubuntu"
  when: ansible_distribution not in ['Debian', 'Ubuntu']

- name: users | Create primary groups with custom GID
  ansible.builtin.group:
    name: "{{ item.group | default(item.name) }}"
    gid: "{{ item.gid | default(omit) }}"
    state: present
  loop: "{{ users_create }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.gid is defined or item.group is defined

- name: users | Create users
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid | default(omit) }}"
    group: "{{ item.group | default(item.name) }}"
    shell: "{{ item.shell | default(users_default_shell) }}"
    groups: "{{ item.groups | default([]) }}"
    append: true
    state: present
    create_home: true
    password: "{{ item.password | default(omit) }}"
    update_password: "{{ item.update_password | default('on_create') }}"
  loop: "{{ users_create }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: users | Add SSH authorized keys
  ansible.posix.authorized_key:
    user: "{{ item.0.name }}"
    key: "{{ item.1 }}"
    state: present
    exclusive: false
  loop: "{{ users_create | subelements('ssh_authorized_keys', skip_missing=true) }}"
  loop_control:
    label: "{{ item.0.name }}"

- name: users | Remove users
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
    remove: true
  loop: "{{ users_remove }}"
